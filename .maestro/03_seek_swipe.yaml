# Fallback if double-tap does not produce a hint (gesture race on the simulator).
appId: com.samayvashsht.playsz
name: Seek with a horizontal swipe
---
# run-qa.py clears saved resume positions and stops the app first.
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "library-title"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "library-title"
    file: _open_video.yaml
# player-back is a Pressable (always an accessibility element); the root
# View's player-screen id is not reliably exposed to the iOS hierarchy.
- extendedWaitUntil:
    visible:
      id: "player-back"
    timeout: 20000
- swipe:
    start: "20%, 38%"
    end: "85%, 38%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "player-hint"
    timeout: 4000
- tapOn:
    id: "player-back"
    optional: true
- extendedWaitUntil:
    visible:
      id: "library-title"
    timeout: 10000
