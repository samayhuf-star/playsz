appId: com.samayvashsht.playsz
name: Assert 7-day trial copy on monthly and yearly plans
---
- assertVisible:
    id: "paywall-screen"
# Trial sentence is shown only when expo-iap reports an eligible intro offer.
# StoreKit Testing with Playsz.storekit should present a 1-week free trial.
- assertVisible:
    id: "paywall-period-playsz_pro_monthly"
- assertVisible:
    id: "paywall-period-playsz_pro_yearly"
- assertVisible: '7 days free, then .*2\.99.*/month'
- assertVisible: '7 days free, then .*19\.99.*/year'
# Lifetime stays a one-time purchase and must not pick up the trial sentence.
- assertVisible: "one-time purchase"
- assertNotVisible: '7 days free, then .*39\.99.*'
